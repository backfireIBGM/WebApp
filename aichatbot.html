<!DOCTYPE html>
<html>
<head>
    <title>Rocket Launch Info</title>
</head>
<body>
    <h1>Rocket Launch Information</h1>
    
    <input type="text" id="questionInput" placeholder="Enter your rocket question">
    <button onclick="getAnswer()">Ask</button>
    
    <div id="result">
        <p>Results will appear here...</p>
    </div>

    <script>
        function getAnswer() {
            // Get the question from the input field
            const question = document.getElementById('questionInput').value;
            
            // Show loading message
            document.getElementById('result').innerHTML = '<p>Loading...</p>';
            
            // Call the Azure Function
            fetch('https://rocketinfo.azurewebsites.net/api/rocketinfo?question=' + encodeURIComponent(question))
                .then(response => {
                    if (!response.ok) {
                        throw new Error('API request failed with status ' + response.status);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log(data); // Log for debugging
                    
                    // Access the properties using lowercase names as shown in your console log
                    const userQuestion = data.question;
                    const aiResponse = data.response;
                    
                    // Format the response text to preserve formatting
                    // Convert markdown-style formatting to HTML
                    const formattedResponse = aiResponse
                        .replace(/\n\n/g, '<br><br>')
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\n(\s*)-\s/g, '<br>•&nbsp;');
                    
                    // Display the response
                    document.getElementById('result').innerHTML = `
                        <h2>Your Question:</h2>
                        <p>${userQuestion}</p>
                        <h2>Answer:</h2>
                        <div>${formattedResponse}</div>
                    `;
                })
                .catch(error => {
                    // Handle errors
                    document.getElementById('result').innerHTML = `
                        <p>Error: ${error.message}</p>
                    `;
                    console.error('Error:', error);
                });
        }
    </script>
</body>
</html>
